[global]
repo1-path=/backup-volume/chessism/database/pgbackrest
repo1-retention-full=2
repo1-retention-full-type=count
repo1-bundle=y
compress-type=zst
compress-level=3
process-max=1
start-fast=y
archive-async=y
archive-push-queue-max=5GiB
archive-timeout=2m
spool-path=/var/spool/pgbackrest
lock-path=/var/spool/pgbackrest/lock
log-path=/var/spool/pgbackrest/log
log-level-console=info

[global:archive-push]
process-max=1

[chessism]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql
pg1-database=chessism_db
pg1-user=chessism_user
