services:
  chessism-api:
    build: .
    # Keep API-only releases persistent across ordinary Compose restarts.
    # Workers retain their own image; deploy the API to this tag, not a temporary override.
    image: chessism-api:runtime
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHESSISM_DATABASE_PROFILE=${CHESSISM_DATABASE_PROFILE:-legacy}
      - CHESSISM_PLAYER_SUMMARIES=${CHESSISM_PLAYER_SUMMARIES:-0}
      - CHESSISM_STOCKFISH_SUMMARIES=${CHESSISM_STOCKFISH_SUMMARIES:-0}
      - CHESSISM_CANONICAL_BLUNDERS=${CHESSISM_CANONICAL_BLUNDERS:-0}
      - REDIS_HOST=${REDIS_HOST}
      - SUPERADMIN_GATE_CODE=${SUPERADMIN_GATE_CODE}
      - AUTH_COOKIE_NAME=${AUTH_COOKIE_NAME}
      - AUTH_SESSION_TTL_DAYS=${AUTH_SESSION_TTL_DAYS}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE}
      - AUTH_GATE_COOKIE_NAME=${AUTH_GATE_COOKIE_NAME}
      - AUTH_GATE_TTL_MINUTES=${AUTH_GATE_TTL_MINUTES}
      - STOCKFISH_STATUS_URL=${STOCKFISH_STATUS_URL}
      - ALGORITHM_WORK_DIR=/research-data/algorithms/tmp
      - ALGORITHM_FREE_FLOOR_BYTES=20000000000
      - BACKUP_VOLUME_ROOT=/backup-volume
      - BACKUP_VOLUME_UUID=1ebffac6-4b7a-4906-9e07-9586060d3825
      - DATABASE_BACKUP_APP_ID=chessism
      - DATABASE_BACKUP_DISPLAY_DIR=/main-monitor-db-backups/chessism/database
      - DATABASE_BACKUP_QUOTA_BYTES=200000000000
      - BACKUP_FREE_FLOOR_BYTES=150000000000
      - DATABASE_BACKUP_USAGE_CACHE_SECONDS=${DATABASE_BACKUP_USAGE_CACHE_SECONDS:-60}
      - FEN_ANALYSIS_BACKUP_DIR=/backup-volume/chessism/fen-analysis
      - FEN_ANALYSIS_BACKUP_DISPLAY_DIR=/main-monitor-db-backups/chessism/fen-analysis
      - MATRIX_ARTIFACT_DIR=/research-data/matrices
      - MATRIX_ARTIFACT_DISPLAY_DIR=${MATRIX_ARTIFACT_DISPLAY_DIR:-/home/jon/Desktop/workshop/last_chessism/research_data/matrices}
      - MATRIX_FREE_FLOOR_BYTES=${MATRIX_FREE_FLOOR_BYTES:-20000000000}
      - CHESSISM_EXPORT_ROOT=/research-data/exports
      - CHESSISM_EXPORT_READER_FILE=/research-data/integrations/export-reader.json
    networks:
      - chessism_net
      - chessism_exports
    depends_on:
      db:
        condition: service_healthy
      stockfish-service:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./research_data:/research-data
      - ./api_logs:/app/logs
      - /main-monitor-db-backups:/backup-volume

  worker-player-summaries:
    image: chessism-api:runtime
    command: python -m chessism_api.operations.player_analytics_worker
    restart: unless-stopped
    init: true
    cpus: "1.0"
    mem_limit: 1g
    stop_grace_period: 15s
    profiles: [player-summaries]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHESSISM_DATABASE_PROFILE=${CHESSISM_DATABASE_PROFILE:-legacy}
      - CHESSISM_PLAYER_SUMMARIES=1
    networks:
      - chessism_net
    depends_on:
      db:
        condition: service_healthy

  worker-stockfish-summaries:
    image: chessism-api:runtime
    command: python -m chessism_api.operations.player_stockfish_worker
    restart: unless-stopped
    init: true
    cpus: "1.0"
    mem_limit: 1g
    stop_grace_period: 15s
    profiles: [stockfish-summaries]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHESSISM_DATABASE_PROFILE=${CHESSISM_DATABASE_PROFILE:-legacy}
      - CHESSISM_STOCKFISH_SUMMARIES=1
    networks:
      - chessism_net
    depends_on:
      db:
        condition: service_healthy

  worker-exports:
    build: .
    image: chessism-api:latest
    command: arq chessism_api.operations.exports.jobs.WorkerSettings
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cpus: "1.0"
    mem_limit: 1g
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHESSISM_DATABASE_PROFILE=${CHESSISM_DATABASE_PROFILE:-legacy}
      - REDIS_HOST=${REDIS_HOST}
      - CHESSISM_EXPORT_ROOT=/research-data/exports
      - CHESSISM_EXPORT_READER_FILE=/run/secrets/chessism_export_reader
    secrets:
      - chessism_export_reader
    volumes:
      - ./research_data/exports:/research-data/exports
    networks:
      - chessism_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  chessism-web:
    build:
      context: .
      dockerfile: chessism_web/Dockerfile
    image: chessism-web:latest
    ports:
      - "6789:6789"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_DEV_PROXY_TARGET=${VITE_DEV_PROXY_TARGET}
    command: sh -lc "npm install --no-fund --no-audit && npm run dev"
    volumes:
      - ./chessism_web:/app
      - chessism_web_node_modules:/app/node_modules
    networks:
      - chessism_net
    depends_on:
      chessism-api:
        condition: service_started

  # Build/check the cloud execution image, then exit. Never runs local analysis.
  cloud-worker-image:
    build: ./stockfish-batch-worker
    image: chessism-stockfish-batch:fen-compat-v1
    platform: linux/amd64
    entrypoint: ["python", "-c"]
    command: ["import stockfish_batch; print('Cloud worker image ready: ' + stockfish_batch.__version__)"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 32

  cloud-controller:
    build:
      context: .
      dockerfile: stockfish-batch-worker/cloud_job/Dockerfile
    image: chessism-cloud-controller:latest
    platform: linux/amd64
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    # Bootstrap drops UID/GID; Docker's root init needs KILL to forward SIGTERM.
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    cpus: "5.0"
    # Four bounded CPU validators plus one serialized database writer.
    # Batch uses bounded 50k units. Cloud Run retains whole-job input/receipt
    # metadata (now up to 6m FENs); allow headroom without reserving host memory.
    mem_limit: 12g
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHESSISM_DATABASE_PROFILE: ${CHESSISM_DATABASE_PROFILE:-legacy}
      CLOUD_WORKER_IMAGE: chessism-stockfish-batch:fen-compat-v1
      CLOUD_CLEANUP_DIRECTORY: /tmp/chessism-cloud-cleanup
    volumes:
      # Read-only mount still permits Docker API operations: trusted controller only.
      - type: bind
        source: ${CLOUD_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLOUD_GCLOUD_CONFIG_DIR:-${HOME}/.config/gcloud}
        target: /host-gcloud
        read_only: true
        bind:
          create_host_path: false
    networks:
      - chessism_net
    depends_on:
      db:
        condition: service_healthy
      chessism-api:
        condition: service_started
      cloud-worker-image:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "cloud_job.run_compose", "--check-health"]
      interval: 20s
      timeout: 5s
      start_period: 5m
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"

  # On-demand billing/upload observations; separate from active job control.
  cloud-billing:
    build:
      context: .
      dockerfile: stockfish-batch-worker/cloud_job/Dockerfile
    image: chessism-cloud-billing:latest
    entrypoint: ["python", "-m", "cloud_billing.serve"]
    platform: linux/amd64
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    cpus: "0.25"
    mem_limit: 384m
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    volumes:
      - type: bind
        source: ${CLOUD_GCLOUD_CONFIG_DIR:-${HOME}/.config/gcloud}
        target: /host-gcloud
        read_only: true
        bind:
          create_host_path: false
    networks:
      - chessism_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

  stockfish-service:
    build:
      context: .
      dockerfile: stockfish-service/Dockerfile
    image: stockfish-service:latest
    environment:
      - STOCKFISH_THREADS=1
      - STOCKFISH_HASH_MB=256
      - STOCKFISH_ENGINE_COUNT=${STOCKFISH_ENGINE_COUNT:-4}
      - STOCKFISH_ANALYSE_TIMEOUT_SEC=300
      - REDIS_HOST=${REDIS_HOST}
    networks:
      - chessism_net

  db:
    build:
      context: .
      dockerfile: postgres-backup/Dockerfile
      target: database
    image: chessism-postgres:15-backup
    # Match the production-sized migration rehearsal; parallel queries use /dev/shm.
    shm_size: "256m"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      # Standalone pg_dump snapshots: no growing historical WAL archive.
      # PostgreSQL still keeps its normal WAL for crash safety.
      - archive_mode=off
      - -c
      - archive_command=
    ports:
      - "5433:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data
      - postgres_socket:/var/run/postgresql
    networks:
      - chessism_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - chessism_net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker-analysis:
    build: .
    image: chessism-local-analysis:runtime
    command: arq worker.WorkerSettings
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHESSISM_DATABASE_PROFILE=${CHESSISM_DATABASE_PROFILE:-legacy}
      - REDIS_HOST=${REDIS_HOST}
      - QUEUE_NAME=analysis_queue
      - ANALYSIS_CONCURRENCY=${ANALYSIS_CONCURRENCY:-4}
      - STOCKFISH_SYZYGY_PATH=${STOCKFISH_SYZYGY_PATH}
    volumes:
      - ./syzygy:/syzygy:ro
    networks:
      - chessism_net
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      stockfish-service:
        condition: service_started

  # Read-only host telemetry; automatically records active Stockfish jobs.
  analysis-telemetry:
    build: .
    image: chessism-api:latest
    command: python -m analysis_telemetry.watcher --output-root /recordings --interval 15
    restart: unless-stopped
    user: "${ANALYSIS_TELEMETRY_UID:-1000}:${ANALYSIS_TELEMETRY_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "0.10"
    mem_limit: 128m
    pids_limit: 32
    environment:
      - REDIS_HOST=redis
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./dev_tools/analysis_telemetry:/app/analysis_telemetry:ro
      - ./research_data/analysis_telemetry:/recordings
      - /sys/devices/system/cpu:/host-cpu:ro
    networks:
      - chessism_net
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

  worker-games:
    build: .
    image: chessism-api:latest
    command: arq worker.WorkerSettings
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHESSISM_DATABASE_PROFILE=${CHESSISM_DATABASE_PROFILE:-legacy}
      - REDIS_HOST=${REDIS_HOST}
      - QUEUE_NAME=games_queue
      - BACKUP_VOLUME_ROOT=/backup-volume
      - BACKUP_VOLUME_UUID=1ebffac6-4b7a-4906-9e07-9586060d3825
      - FEN_ANALYSIS_BACKUP_DIR=/backup-volume/chessism/fen-analysis
      - FEN_ANALYSIS_BACKUP_DISPLAY_DIR=/main-monitor-db-backups/chessism/fen-analysis
    volumes:
      - /main-monitor-db-backups:/backup-volume
    networks:
      - chessism_net
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  worker-research:
    build: .
    # Coefficient-only research releases must not replace ingestion/FEN images.
    image: chessism-research:runtime
    command: arq worker.WorkerSettings
    cpus: "1.00"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHESSISM_DATABASE_PROFILE=${CHESSISM_DATABASE_PROFILE:-legacy}
      - REDIS_HOST=${REDIS_HOST}
      - QUEUE_NAME=research_queue
      - BACKUP_VOLUME_ROOT=/backup-volume
      - BACKUP_VOLUME_UUID=1ebffac6-4b7a-4906-9e07-9586060d3825
      - FEN_ANALYSIS_BACKUP_DIR=/backup-volume/chessism/fen-analysis
      - COEFFICIENT_RESEARCH_DIR=/backup-volume/chessism/research
      - COEFFICIENT_RESEARCH_DISPLAY_DIR=/main-monitor-db-backups/chessism/research
      - MATRIX_ARTIFACT_DIR=/research-data/matrices
      - MATRIX_ARTIFACT_DISPLAY_DIR=${MATRIX_ARTIFACT_DISPLAY_DIR:-/home/jon/Desktop/workshop/last_chessism/research_data/matrices}
      - MATRIX_FREE_FLOOR_BYTES=${MATRIX_FREE_FLOOR_BYTES:-20000000000}
    volumes:
      - ./research_data:/research-data
      - /main-monitor-db-backups:/backup-volume
    networks:
      - chessism_net
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  worker-algorithms:
    build:
      context: .
      dockerfile: dev_tools/Dockerfile.algorithms-cuda
    # Research releases are independent of the ingestion/FEN worker image.
    image: chessism-algorithms:runtime
    command: arq chessism_api.operations.research_algorithms.worker.WorkerSettings
    # Host transport/validation uses bounded input and merge/packing buffers.
    # Equations remain on the RTX 4060; these are not CPU calculation workers.
    cpus: "${CHESSISM_ALGORITHMS_CPUS:-4.00}"
    mem_limit: ${CHESSISM_ALGORITHMS_MEMORY:-16g}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${CHESSISM_ALGORITHMS_GPU_DEVICE:-1}"]
              capabilities: [gpu]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHESSISM_DATABASE_PROFILE=${CHESSISM_DATABASE_PROFILE:-legacy}
      - REDIS_HOST=${REDIS_HOST}
      - ALGORITHM_WORK_DIR=/research-data/algorithms/tmp
      - ALGORITHM_FREE_FLOOR_BYTES=20000000000
      - OPENBLAS_NUM_THREADS=1
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
    volumes:
      - ./research_data:/research-data
    networks:
      - chessism_net
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  worker-salience:
    build: .
    # Consumes legacy queue wake-ups but defers salience to manual CUDA runs.
    image: chessism-salience:runtime
    command: arq worker.WorkerSettings
    cpus: "0.50"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHESSISM_DATABASE_PROFILE=${CHESSISM_DATABASE_PROFILE:-legacy}
      - REDIS_HOST=${REDIS_HOST}
      - QUEUE_NAME=salience_queue
    networks:
      - chessism_net
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  worker-backup:
    build:
      context: .
      dockerfile: postgres-backup/Dockerfile
      target: backup-worker
    image: chessism-backup-worker:latest
    # Restore tests start a private PostgreSQL; give it the same tested shared memory.
    shm_size: "256m"
    command: arq worker.WorkerSettings
    user: postgres
    cpus: "1.00"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHESSISM_DATABASE_PROFILE=${CHESSISM_DATABASE_PROFILE:-legacy}
      - REDIS_HOST=${REDIS_HOST}
      - QUEUE_NAME=backup_queue
      - MATRIX_ARTIFACT_DIR=/research-data/matrices
      - BACKUP_VOLUME_ROOT=/backup-volume
      - BACKUP_VOLUME_UUID=1ebffac6-4b7a-4906-9e07-9586060d3825
      - DATABASE_BACKUP_APP_ID=chessism
      - DATABASE_BACKUP_DISPLAY_DIR=/main-monitor-db-backups/chessism/database
      - DATABASE_BACKUP_QUOTA_BYTES=200000000000
      - BACKUP_FREE_FLOOR_BYTES=150000000000
      - DATABASE_BACKUP_USAGE_CACHE_SECONDS=${DATABASE_BACKUP_USAGE_CACHE_SECONDS:-60}
      - PGBACKREST_STANZA=chessism
      - CHESSISM_ARCHIVE_GAP_PATH=/var/spool/pgbackrest/chessism-archive-gap
      - DATABASE_RESTORE_TEST_ROOT=/restore-test
      - DATABASE_RESTORE_TEST_HEADROOM_BYTES=15000000000
      - DATABASE_RESTORE_TEST_TIMEOUT_SECONDS=21600
      - RESTORE_TEST_DB_USER=${POSTGRES_USER}
      - RESTORE_TEST_DB_NAME=${POSTGRES_DB}
    volumes:
      - ./research_data:/research-data:ro
      - ./db_data:/var/lib/postgresql/data:ro
      - /main-monitor-db-backups:/backup-volume
      - pgbackrest_spool:/var/spool/pgbackrest
      - postgres_socket:/var/run/postgresql
      - database_restore_test:/restore-test
    networks:
      - chessism_net
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  fen-worker-1:
    build: .
    image: chessism-ingestion:runtime
    container_name: fen-worker-1
    command: arq worker.WorkerSettings
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHESSISM_DATABASE_PROFILE=${CHESSISM_DATABASE_PROFILE:-legacy}
      - REDIS_HOST=${REDIS_HOST}
      - QUEUE_NAME=fen_queue
    networks:
      - chessism_net
    logging: &fen-worker-logging
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    depends_on:
      - redis
      - db

  fen-worker-2:
    build: .
    image: chessism-ingestion:runtime
    container_name: fen-worker-2
    command: arq worker.WorkerSettings
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHESSISM_DATABASE_PROFILE=${CHESSISM_DATABASE_PROFILE:-legacy}
      - REDIS_HOST=${REDIS_HOST}
      - QUEUE_NAME=fen_queue
    networks:
      - chessism_net
    logging: *fen-worker-logging
    depends_on:
      - redis
      - db

  fen-worker-3:
    build: .
    image: chessism-ingestion:runtime
    container_name: fen-worker-3
    command: arq worker.WorkerSettings
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHESSISM_DATABASE_PROFILE=${CHESSISM_DATABASE_PROFILE:-legacy}
      - REDIS_HOST=${REDIS_HOST}
      - QUEUE_NAME=fen_queue
    networks:
      - chessism_net
    logging: *fen-worker-logging
    depends_on:
      - redis
      - db

  # FEN archives have their own queue: they must not hold up position extraction.
  worker-fen-backup:
    build: .
    image: chessism-fen-backup:runtime
    command: arq chessism_api.operations.fen_backup.worker.WorkerSettings
    restart: unless-stopped
    init: true
    cpus: "1.0"
    mem_limit: 1g
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHESSISM_DATABASE_PROFILE=${CHESSISM_DATABASE_PROFILE:-legacy}
      - REDIS_HOST=${REDIS_HOST}
      - BACKUP_VOLUME_ROOT=/backup-volume
      - BACKUP_VOLUME_UUID=1ebffac6-4b7a-4906-9e07-9586060d3825
      - FEN_ANALYSIS_BACKUP_DIR=/backup-volume/chessism/fen-analysis
      - FEN_ANALYSIS_BACKUP_DISPLAY_DIR=/main-monitor-db-backups/chessism/fen-analysis
    volumes:
      - /main-monitor-db-backups:/backup-volume
    networks:
      - chessism_net
    depends_on:
      - redis
      - db

  # Ingestion coordinator. Existing archive jobs can drain on the old worker.
  pipeline-worker:
    build: .
    # Independent persistent release; other queue workers keep their images.
    image: chessism-ingestion:runtime
    container_name: pipeline-worker
    command: arq worker.WorkerSettings
    # Bounded Syzygy process pool; no change to a running container until deployed.
    # This is independent of Stockfish nodes/threads and cloud VM settings.
    cpus: "${INGESTION_CPU_LIMIT:-4.0}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CHESSISM_DATABASE_PROFILE=${CHESSISM_DATABASE_PROFILE:-legacy}
      - REDIS_HOST=${REDIS_HOST}
      - QUEUE_NAME=pipeline_queue # <-- Listens to its own queue
      - TABLEBASE_PROBE_WORKERS=${TABLEBASE_PROBE_WORKERS:-4}
      - BACKUP_VOLUME_ROOT=/backup-volume
      - BACKUP_VOLUME_UUID=1ebffac6-4b7a-4906-9e07-9586060d3825
      - FEN_ANALYSIS_BACKUP_DIR=/backup-volume/chessism/fen-analysis
      - FEN_ANALYSIS_BACKUP_DISPLAY_DIR=/main-monitor-db-backups/chessism/fen-analysis
      - STOCKFISH_SYZYGY_PATH=${STOCKFISH_SYZYGY_PATH}
    volumes:
      - /main-monitor-db-backups:/backup-volume
      - ./syzygy:/syzygy:ro
    networks:
      - chessism_net
    depends_on:
      - redis
      - db

networks:
  chessism_net:
    driver: bridge
  chessism_exports:
    name: chessism_exports
    driver: bridge
    internal: true

secrets:
  chessism_export_reader:
    file: ./research_data/integrations/export-reader.json

volumes:
  redis_data:
  db_data:
  chessism_web_node_modules:
  pgbackrest_spool:
  postgres_socket:
  database_restore_test:
