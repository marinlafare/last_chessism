<!doctype html>
<html><head><meta charset="UTF-8"><title>Cloud analysis isolated UI test</title></head>
<body><div id="root"></div><script type="module">
import React from 'react'
import { createRoot } from 'react-dom/client'
import CloudAnalysisSection from '/src/pages/positions/CloudAnalysisSection.jsx'
import CloudGameDraft from '/src/pages/positions/CloudGameDraft.jsx'
import AnalysisDisclosure from '/src/pages/positions/AnalysisDisclosure.jsx'
import AppearanceProvider, { AppearanceControls } from '/src/appearance/AppearanceProvider.jsx'
import '/src/pages/positions/cloudAnalysis.css'
import '/src/index.css'

const job = { id: 'cloud-test', status: 'running', target: 2082, imported: 500,
  selection: { mode: 'games', player_name: 'magnuscarlsen' }, error: null,
  runs: [{ id: 'run-test', status: 'running', cloud_state: 'RUNNING', batch_jobs: ['batch-test'] }] }
const state = window.cloudTest = { job, online: true, requests: [], previewCount: 2082,
  history: [
    { ...job, id: 'old-complete', status: 'complete', imported: 2082, runs: [{ ...job.runs[0], status: 'complete' }] },
    { ...job, id: 'old-cancelled', status: 'cancelled', runs: [] },
  ] }
const restoreDraft = new URLSearchParams(location.search).has('restoreDraft')
const draftOnly = new URLSearchParams(location.search).has('draftOnly')
const appearance = new URLSearchParams(location.search).has('appearance')
const independentStyles = new URLSearchParams(location.search).has('independentStyles')
if (appearance) {
  history.replaceState(null, '', '/positions')
  job.runs[0].vm_statuses = [0, 1].map(index => ({ index, state: 'RUNNING', positions: 1041, preemptions: 0, application_failures: 0 }))
}
const groupPreview = draft => {
  const fens = draft.entries.length ? (draftOnly ? (draft.entries.length > 1 ? 3 : 2) : (draft.entries.length > 1 ? 1300000 : 800000)) : 0
  draft.preview = { revision: draft.revision, unique_games: draft.entries.length * 30,
    unique_missing_fens: fens, claimed_fens: 0, fens_to_analyze: fens, within_limit: true }
}
if (restoreDraft) {
  state.draft = JSON.parse(sessionStorage.getItem('cloud-draft-fixture'))
  job.status = 'complete'
}
window.fetch = async (input, options = {}) => {
  const url = new URL(input, location.href), method = options.method || 'GET'
  state.requests.push({ path: url.pathname, method, body: options.body ? JSON.parse(options.body) : null })
  const reply = (value, status=200) => new Response(JSON.stringify(value), { status, headers: { 'Content-Type': 'application/json' } })
  if (url.pathname.endsWith('/appearance') || url.pathname.endsWith('/appearance/save')) {
    let saved = JSON.parse(localStorage.getItem('cloud-style-fixture') || 'null') || { revision: 0, presets: [], active_preset_id: null, overrides: [] }
    if (method === 'POST' && url.pathname.endsWith('/appearance/save')) {
      saved = { revision: saved.revision + 1, presets: [{ id: 'style-test', name: 'Test' }], active_preset_id: 'style-test', overrides: JSON.parse(options.body).overrides }
      localStorage.setItem('cloud-style-fixture', JSON.stringify(saved))
    }
    return reply({ ...saved, registry: window.cloudStyleRegistry })
  }
  if (url.pathname.endsWith('/analysis/cloud')) {
    if (method === 'POST') {
      const payload = JSON.parse(options.body)
      Object.assign(job, { id: 'next-job', status: 'queued', imported: 0,
        target: payload.mode === 'games' ? state.previewCount : payload.total_fens, runs: [], selection: payload })
      return reply({ id: job.id, status: job.status }, 202)
    }
    const terminal = ['complete', 'cancelled'].includes(job.status)
    return reply({ controller_online: state.online, cloud_busy: !terminal,
      blocking_job_id: terminal ? null : job.id, jobs: [job, ...state.history] })
  }
  if (url.pathname.endsWith('/analysis/player_games/preview')) {
    if (state.previewError) return reply({ detail: state.previewError }, 500)
    state.previewForm = JSON.parse(options.body)
    return reply({ plan_id: 'a'.repeat(32), selected_games: 30, fens_to_analyze: state.previewCount })
  }
  const drafts = url.pathname.split('/analysis/cloud/drafts')[1]
  if (drafts !== undefined) {
    if (drafts === '/current') return reply(state.draft?.submitted_job_id ? null : state.draft || null)
    if (drafts === '') {
      state.draft = state.draft && !state.draft.submitted_job_id ? state.draft : {
        id: 'd'.repeat(32), revision: 1, entries: [], preview: null, max_fens: 10000000, max_entries: 100,
      }
      return reply(state.draft, 201)
    }
    const body = options.body ? JSON.parse(options.body) : {}, draft = state.draft
    if (drafts.endsWith('/entries')) {
      if (state.holdSave) await new Promise(resolve => { state.finishSave = resolve })
      if (state.entryError) return reply({ detail: state.entryError }, 500)
      const form = state.previewForm
      const entry = { id: body.replace_entry_id || `entry-${draft.revision}`, player_name: form.player_name,
        selection_mode: form.selection_mode, selection_order: form.selection_mode === 'oldest' ? 'oldest' : 'latest',
        requested_games: form.game_limit, date_from: form.date_from, date_to: form.date_to,
        selected_games: 30, preview_fens: state.previewCount }
      const index = draft.entries.findIndex(e => e.id === body.replace_entry_id)
      if (index >= 0) draft.entries[index] = entry
      else draft.entries.push(entry)
      draft.revision++; groupPreview(draft)
      return reply(draft)
    }
    if (drafts.endsWith('/remove')) {
      const entryId = drafts.split('/').at(-2)
      draft.entries = draft.entries.filter(e => e.id !== entryId)
      draft.revision++; groupPreview(draft)
      return reply(draft)
    }
    if (drafts.endsWith('/preview')) {
      if (state.groupError) return reply({ detail: state.groupError }, 500)
      groupPreview(draft)
      return reply(draft)
    }
    if (drafts.endsWith('/submit')) {
      if (job.status !== 'complete') return reply({ detail: 'Cloud job still active' }, 409)
      Object.assign(job, { id: 'combined-job', status: 'queued', imported: 0, target: draft.preview.fens_to_analyze,
        runs: [], sequence: null, selection: { backend: 'batch_spot', mode: 'games', player_name: '' } })
      draft.submitted_job_id = job.id
      return reply({ id: job.id, status: job.status, target: job.target }, 202)
    }
  }
  if (url.pathname.endsWith('/analysis_counts')) return reply({ total_positions: 3000, analyzed_positions: 1000 })
  if (url.pathname.endsWith('/resume')) { job.status = 'queued'; return reply({ id: job.id, status: job.status }, 202) }
  if (url.pathname.endsWith('/stop-and-cleanup')) {
    if (state.stopError) return reply({ detail: 'Synthetic stop failed' }, 503)
    if (state.holdStop) await new Promise(resolve => { state.finishStop = resolve })
    job.stop_cleanup = { phase: 'stopping', requested_at: new Date().toISOString(), finished_at: null }
    return reply({ id: job.id, status: 'stop_cleanup_requested', phase: 'stopping' }, 202)
  }
  throw new Error(`Unexpected request: ${method} ${url.pathname}; no real API requests allowed`)
}
function DraftFixture() {
  const [draft, setDraft] = React.useState(null)
  const [key, setKey] = React.useState(0)
  const [vms, setVms] = React.useState(6)
  const [cpus, setCpus] = React.useState(100)
  state.remount = () => setKey(value => value + 1)
  return React.createElement(CloudGameDraft, { key, draft, setDraft, launchDisabled: false,
    backend: new URLSearchParams(location.search).get('backend') || 'batch_spot',
    nVms: vms, onVmChange: setVms, nCpus: cpus, onCpuChange: setCpus })
}
createRoot(document.getElementById('root')).render(draftOnly ? React.createElement(DraftFixture)
  : appearance ? React.createElement(AppearanceProvider, { account: { role: 'admin' }, pageKey: '/positions' },
    React.createElement(AppearanceControls),
    React.createElement(AnalysisDisclosure, { id: 'analysis-local', label: 'Local' }, 'Synthetic local selection'),
    React.createElement(CloudAnalysisSection, { collapsible: independentStyles }))
  : React.createElement(CloudAnalysisSection, { collapsible: restoreDraft }))
</script></body></html>
