<!doctype html>
<html><head><meta charset="UTF-8"><title>Homepage isolated UI test</title></head>
<body><div id="root"></div><script type="module">
import React from 'react'
import { createRoot } from 'react-dom/client'
import App from '/src/App.jsx'
import '/src/index.css'

const initial = new URLSearchParams(location.search).get('initial') || '/'
const summaryScenario = new URLSearchParams(location.search).get('summary') || ''
history.replaceState(null, '', initial.startsWith('/') && !initial.startsWith('//') ? initial : '/')
localStorage.clear() // Isolated browser profile only.
const names = ['hikaru', 'magnuscarlsen', ...Array.from({length:50}, (_, i) => `player${i+3}`)]
const state = window.homeTest = { requests: [], unexpected: [], aborted: [], failStatus: false, slowPlayer: '', scrolls: [],
  failCloudStatus: false, clockOffsetMs: 0, cloudUsage: {}, cloud: { controller_online: true, cloud_busy: false, jobs: [] } }
const realNow = Date.now.bind(Date)
state.failBilling = false
state.homeSummary = { total_fens:600000,titled_players:7,titled_fens:400000,titled_games:24000,
  refreshed_at:'2026-10-11T00:00:00Z',stale:false,refresh_error:null,
  players:[{player_name:'hikaru',title:'GM',games:7500,game_half_units:13001,avatar:'/chessism.jpg'},
    {player_name:'magnuscarlsen',title:'GM',games:6500,game_half_units:6999,avatar:'/tests/fixtures/home.html'},
    {player_name:'player3',title:'IM',games:8000,game_half_units:8000},
    {player_name:'player4',title:'GM',games:6200,game_half_units:6200,avatar:'/chessism.jpg'},
    {player_name:'player5',title:'GM',games:5000,game_half_units:5000},
    {player_name:'player6',title:'GM',games:4800,game_half_units:4800},
    {player_name:'player7',title:'GM',games:4000,game_half_units:4000}],
  untitled_players:[{player_name:'untitled-first',title:'',games:3210},
    {player_name:'untitled-second',title:'',games:7650}] }
state.summaryReady = structuredClone(state.homeSummary)
if (summaryScenario === 'loading') state.homeSummary = {total_fens:null,titled_players:null,titled_fens:null,titled_games:null,refreshed_at:null,stale:true,players:[]}
if (summaryScenario === 'empty') state.homeSummary = {...state.homeSummary,total_fens:0,titled_fens:0,titled_games:0,titled_players:0,players:[],untitled_players:[]}
if (summaryScenario === 'stale') state.homeSummary.stale = true
if (summaryScenario === 'millions') state.homeSummary = {...state.homeSummary,total_fens:7600000,titled_fens:3800000}
state.billing = {
  project:'chessism-production',fetched_at:'2026-10-10T12:00:00Z',next_refresh_at:'2026-10-10T13:00:00Z',stale:false,
  periods:[{id:'2026-10',has_data:true,exported_at:'2026-10-10T09:00:00Z',usage_through:'2026-10-10T08:00:00Z',currencies:[{
    currency:'USD',cost:'12.5',credits:'-2.5',net:'10',
    services:[{service:'Compute Engine',cost:'11',credits:'-2',net:'9'},{service:'Cloud Storage',cost:'1.5',credits:'-0.5',net:'1'}],
    days:[{day:'2026-10-09',cost:'12.5',credits:'-2.5',net:'10'}],
  }]},{id:'2026-09',has_data:false,currencies:[]}],
}
Date.now = () => realNow() + state.clockOffsetMs // ETA test time, isolated to this mocked tab.
// Exercise polling and its teardown quickly, only in this fully mocked tab.
const realTimeout = window.setTimeout.bind(window)
window.setTimeout = (fn, delay, ...args) => realTimeout(fn, [5000,10000,20000,30000,...(summaryScenario ? [15000,60000] : [])].includes(delay) ? 150 : delay, ...args)
const originalScroll = Element.prototype.scrollIntoView
Element.prototype.scrollIntoView = function(options) {
  state.scrolls.push(this.id)
  originalScroll.call(this, {...options, behavior:'instant'})
}
window.fetch = async (input, options = {}) => {
  const url = new URL(input, location.href), path = url.pathname.replace(/^\/api(?=\/)/, ''), method = options.method || 'GET'
  state.requests.push({path, method, search:url.search})
  const reply = (value, status=200) => new Response(JSON.stringify(value), {status,headers:{'Content-Type':'application/json'}})
  if (method !== 'GET') { state.unexpected.push(`${method} ${path}`); throw new Error('No writes allowed in homepage test') }
  if (path === '/auth/me') return reply({account:{name:'Test admin',role:'superadmin'}})
  if (path === '/appearance') return reply({revision:0,active_preset_id:null,presets:[],overrides:[]})
  if (path === '/games/generalities') return reply({main_characters:52,n_games_in_db:10000,n_positions:600000,scored_fens:400000})
  if (path === '/games/home_summary') return state.failSummary ? reply({detail:'Unavailable'},503) : reply(state.homeSummary)
  if (path === '/players/main_characters/top') {
    const untitled = url.searchParams.get('title_status') === 'untitled'
    const players = untitled ? ['untitled-first','untitled-second'] : names
    if (state.failRankings) return reply({detail:'Rankings unavailable'},503)
    return reply({players:state.emptyRankings ? [] : players.map((player_name,i)=>({player_name,full_name:player_name,
      title:untitled ? '' : 'GM',rating:(untitled ? 2200 : 3200)-i})).reverse()})
  }
  if (path === '/status') return state.failStatus ? reply({detail:'Unavailable'},503) : reply({
    workers:{total:4,busy:2,idle:2},jobs:{queued:1,running:1,failed:0,completed:12},version:{backend:'test',stockfish:'16.1'},
  })
  if (path === '/analysis/cloud') return state.failCloudStatus ? reply({detail:'Unavailable'},503) : reply(state.cloud)
  if (path === '/analysis/cloud/billing') return state.failBilling ? reply({detail:'Billing temporarily unavailable'},503) : reply(state.billing)
  if (/^\/analysis\/cloud\/[^/]+\/usage$/.test(path)) return reply(state.cloudUsage[path.split('/')[3]] || {phases:[]})
  if (path === '/players/navigation') return reply({players:names})
  if (/^\/players\/[^/]+\/deletion-preview$/.test(path)) return reply({
    exclusive_games:42,shared_games:8,fen_associations:2000,analyzed_fen_associations:1500,
  })
  if (/^\/players\/[^/]+\/neighbors$/.test(path)) return reply({previous_player:'hikaru',next_player:'magnuscarlsen'})
  if (/^\/games\/[^/]+\/hours_played$/.test(path)) return reply({bullet_games:30,bullet_hours:2,blitz_games:20,blitz_hours:3,rapid_games:10,rapid_hours:4})
  if (/^\/fens\/players\/[^/]+\/analysis_counts$/.test(path)) return reply(path.includes('/player51/')
    ? {total_games:1000000,analyzed_games:340000,total_fens:2563236,analyzed_fens:1289308}
    : {total_games:60,analyzed_games:50,total_fens:3000,analyzed_fens:2500})
  if (path.endsWith('/analysis/behavioural/ratings')) return reply({series: path.includes('/players/player52/') ? [] : [
    {mode:'bullet',points:[['2023-12-31',2900],['2024-01-01',3000],['2024-06-15',3100],['2025-01-01',2950]]
      .map(([date,last_rating])=>({date,last_rating}))},
    {mode:'blitz',points:[['2024-02-01',3100],['2024-10-01',2950]].map(([date,last_rating])=>({date,last_rating}))},
  ]})
  if (path.includes('/analysis/behavioural/')) return reply({weekdays:[],hours:[],weekday_hours:[]})
  if (path.endsWith('/analysis/measures/quality-calendar')) return reply({coverage:{total_games:60,eligible_games:50},weekdays:[],hours:[],weekday_hours:[]})
  if (path.includes('/analysis/measures/daily-')) return reply({points:[['2025-01-01',82,81,4,10]],salience:{status:'ready'}})
  if (/^\/players\/[^/]+$/.test(path)) {
    const player = decodeURIComponent(path.split('/')[2])
    if (player === state.slowPlayer) await new Promise((resolve,reject) => {
      const abort = () => { clearTimeout(timer); state.aborted.push(player); reject(new DOMException('Aborted','AbortError')) }
      const timer = setTimeout(() => { options.signal?.removeEventListener('abort',abort); resolve() },2000)
      if (options.signal?.aborted) abort()
      else options.signal?.addEventListener('abort',abort,{once:true})
    })
    if (player === 'missing') return reply({detail:'Player not found'},404)
    return reply({player_name:player,name:player,joined:1700000000,country:'US',followers:100,avatar:''})
  }
  state.unexpected.push(`${method} ${path}`)
  throw new Error(`Unexpected request: ${method} ${path}; production APIs are never contacted`)
}
createRoot(document.getElementById('root')).render(React.createElement(App))
</script></body></html>
