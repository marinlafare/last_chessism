# Explicit maintenance-only CLI. Never included by ordinary docker compose up.
services:
  game-player-migration:
    image: sha256:a3c0962fa5a3e631be743ae9a1782ab7c6bb332dd67dd34814e8be0d54977f57
    profiles: [maintenance]
    user: postgres
    working_dir: /candidate
    entrypoint: [python, scripts/migrate_game_player.py]
    command: [--help]
    restart: "no"
    init: true
    stop_grace_period: 2m
    read_only: true
    cpus: "2.0"
    mem_limit: 4g
    tmpfs:
      - /tmp:rw,nosuid,size=128m,mode=1777
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
      PYTHONPATH: /candidate:/candidate/stockfish-batch-worker
      BACKUP_VOLUME_ROOT: /backup-volume
      BACKUP_VOLUME_UUID: 1ebffac6-4b7a-4906-9e07-9586060d3825
      BACKUP_FREE_FLOOR_BYTES: "150000000000"
      PGBACKREST_STANZA: chessism
      PGBACKREST_LOG_LEVEL_FILE: "off"
      PGBACKREST_LOCK_PATH: /tmp/pgbackrest-lock
      PGBACKREST_SPOOL_PATH: /tmp/pgbackrest-spool
      CHESSISM_ARCHIVE_GAP_PATH: /live-spool/chessism-archive-gap
    volumes:
      - .:/candidate:ro
      - ./.local-migrations/db-refactor:/reports
      - ./db_data:/var/lib/postgresql/data:ro
      - /main-monitor-db-backups:/backup-volume:ro
      - pgbackrest_spool:/live-spool:ro
    networks: [chessism_net]
networks:
  chessism_net:
    external: true
    name: last_chessism_chessism_net
volumes:
  pgbackrest_spool:
    external: true
    name: last_chessism_pgbackrest_spool
